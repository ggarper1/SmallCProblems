# Nombre base con número y slug del título (minúsculas, 64 chars)
branchName: 'issue-${issue.number}-${issue.title,[0,64],}'
gitSafeReplacementChar: '-'

baseBranch: 'main'

# Prefijos según label
branches:
  - label: feat
    prefix: 'feature/'
    name: 'main'
    prTarget: 'main' 
    
  - label: feature
    prefix: 'feature/'
    name: 'main'
    prTarget: 'main'
    
  - label: bug
    prefix: 'fix/'
    name: 'main'
    prTarget: 'main'
    
  - label: refactor
    prefix: 'refactor/'
    name: 'main'
    prTarget: 'main'

  - label: new-problem
    prefix: 'new-problem/'
    name: 'main'
    prTarget: 'main'

    
  # Fallback para cualquier otro tipo de issue:
  - label: '*'
    prefix: 'issue/'
    name: 'main'
    prTarget: 'main' 

# Opcional: abrir PR en draft automáticamente
openDraftPR: true
autoCloseIssue: true
autoDeleteBranch: true

# copiar metadata
copyIssueLabelsToPR: true
copyIssueDescriptionToPR: true
copyIssueAssigneeToPR: true
copyIssueMilestoneToPR: true
